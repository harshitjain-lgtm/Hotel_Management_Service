services:
  postgres:
    image: postgres:16-alpine
    container_name: staydesk-postgres
    environment:
      POSTGRES_USER: staydesk
      POSTGRES_PASSWORD: staydesk
      POSTGRES_DB: staydesk
    ports:
      - "5433:5432"
    volumes:
      - staydesk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staydesk -d staydesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  staydesk-pgdata:
